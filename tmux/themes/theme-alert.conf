# theme: alert

set -g status-style 'bg=#1a1b26 fg=#a9b1d6'
set -g status-left-length 30
set -g status-right-length 60

set -g status-left '#[fg=#16161e,bold]#{?client_prefix,#[bg=#e0af68],#[bg=#f7768e]} #S #[fg=#a9b1d6,bg=#1a1b26,nobold] '
set -g status-right '#[fg=#f7768e,bold]%H:%M #[fg=#414868]· #[fg=#a9b1d6]%d %b #[fg=#414868]· #[fg=#a9b1d6]%A '

set -g window-status-format '#[fg=#565f89] #I #[fg=#a9b1d6]#W#{?window_activity_flag,#[fg=#e0af68] ●,} '
set -g window-status-current-format '#[fg=#f7768e,bg=#24283b,bold] #I #[fg=#c0caf5]#W#{?window_zoomed_flag,#[fg=#f7768e] Z,} '

set -g pane-border-style 'fg=#2f3549'
set -g pane-active-border-style 'fg=#f7768e'

set -g message-style 'bg=#f7768e,fg=#16161e,bold'
set -g message-command-style 'bg=#24283b,fg=#c0caf5'

set -gw mode-style 'bg=#3b4261,fg=#c0caf5'
set -gw copy-mode-match-style 'bg=#6b3b4b,fg=#ffe8ee'
set -gw copy-mode-current-match-style 'bg=#f7768e,fg=#16161e,bold'

set -g display-panes-colour '#565f89'
set -g display-panes-active-colour '#f7768e'
set -g clock-mode-colour '#f7768e'
