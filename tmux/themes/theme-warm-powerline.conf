# theme: warm powerline

set -g status-style 'bg=#221f1e fg=#c7b7a8'
set -g status-left-length 30
set -g status-right-length 60

set -g status-left '#[bold]#{?client_prefix,#[fg=#ffb142],#[fg=#f2e5d8]}#{?client_prefix,#[bg=#3a2a20],#[bg=#2b2523]} #S #[nobold]#{?client_prefix,#[fg=#3a2a20],#[fg=#2b2523]}#[bg=#221f1e] '
set -g status-right '#[fg=#ffb142,bold]%H:%M #[fg=#4a403a]· #[fg=#c7b7a8]%d %b #[fg=#4a403a]· #[fg=#c7b7a8]%A '

set -g window-status-format '#[fg=#6d5f54] #I #[fg=#c7b7a8]#W#{?window_activity_flag,#[fg=#ff793c] ●,} '
set -g window-status-current-format '#[fg=#ffb142,bg=#2c2725,bold] #I #[fg=#f2e5d8]#W#{?window_zoomed_flag,#[fg=#ffb142] Z,} #[nobold]#[fg=#2c2725]#[bg=#221f1e] '

set -g pane-border-style 'fg=#3d3431'
set -g pane-active-border-style 'fg=#ffb142'

set -g message-style 'bg=#ffb142,fg=#1e1b18,bold'
set -g message-command-style 'bg=#2c2725,fg=#f2e5d8'

set -gw mode-style 'bg=#5a4632,fg=#f5e6d3'
set -gw copy-mode-match-style 'bg=#7a5a34,fg=#fff3df'
set -gw copy-mode-current-match-style 'bg=#ffb142,fg=#1e1b18,bold'

set -g display-panes-colour '#6d5f54'
set -g display-panes-active-colour '#ffb142'
set -g clock-mode-colour '#ffb142'
