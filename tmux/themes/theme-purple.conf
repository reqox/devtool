# theme: purple

set -g status-style 'bg=#1b1926 fg=#b6b0cc'
set -g status-left-length 30
set -g status-right-length 60

set -g status-left '#[fg=#14121e,bold]#{?client_prefix,#[bg=#e8c07d],#[bg=#c0aef2]} #S #[fg=#b6b0cc,bg=#1b1926,nobold] '
set -g status-right '#[fg=#c0aef2,bold]%H:%M #[fg=#3e3858]· #[fg=#b6b0cc]%d %b #[fg=#3e3858]· #[fg=#b6b0cc]%A '

set -g window-status-format '#[fg=#716b8d] #I #[fg=#b6b0cc]#W#{?window_activity_flag,#[fg=#e8c07d] ●,} '
set -g window-status-current-format '#[fg=#c0aef2,bg=#272338,bold] #I #[fg=#e9e4f7]#W#{?window_zoomed_flag,#[fg=#c0aef2] Z,} '

set -g pane-border-style 'fg=#302b45'
set -g pane-active-border-style 'fg=#c0aef2'

set -g message-style 'bg=#c0aef2,fg=#14121e,bold'
set -g message-command-style 'bg=#272338,fg=#e9e4f7'

set -gw mode-style 'bg=#3b3560,fg=#eae5f9'
set -gw copy-mode-match-style 'bg=#514878,fg=#f4f0ff'
set -gw copy-mode-current-match-style 'bg=#c0aef2,fg=#14121e,bold'

set -g display-panes-colour '#716b8d'
set -g display-panes-active-colour '#c0aef2'
set -g clock-mode-colour '#c0aef2'
