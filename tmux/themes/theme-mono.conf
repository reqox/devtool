# theme: mono

set -g status-style 'bg=#171717 fg=#b5b5b5'
set -g status-left-length 30
set -g status-right-length 60

set -g status-left '#[fg=#111111,bold]#{?client_prefix,#[bg=#ffffff],#[bg=#d9d9d9]} #S #[fg=#b5b5b5,bg=#171717,nobold] '
set -g status-right '#[fg=#d9d9d9,bold]%H:%M #[fg=#3f3f3f]· #[fg=#b5b5b5]%d %b #[fg=#3f3f3f]· #[fg=#b5b5b5]%A '

set -g window-status-format '#[fg=#6b6b6b] #I #[fg=#b5b5b5]#W#{?window_activity_flag,#[fg=#ffffff] ●,} '
set -g window-status-current-format '#[fg=#d9d9d9,bg=#262626,bold] #I #[fg=#ededed]#W#{?window_zoomed_flag,#[fg=#d9d9d9] Z,} '

set -g pane-border-style 'fg=#303030'
set -g pane-active-border-style 'fg=#d9d9d9'

set -g message-style 'bg=#d9d9d9,fg=#111111,bold'
set -g message-command-style 'bg=#262626,fg=#ededed'

set -gw mode-style 'bg=#3a3a3a,fg=#f0f0f0'
set -gw copy-mode-match-style 'bg=#4d4d4d,fg=#ffffff'
set -gw copy-mode-current-match-style 'bg=#d9d9d9,fg=#111111,bold'

set -g display-panes-colour '#6b6b6b'
set -g display-panes-active-colour '#d9d9d9'
set -g clock-mode-colour '#d9d9d9'
