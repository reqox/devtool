# theme: simple

set -g status-style 'bg=#1a1d22 fg=#8d949e'
set -g status-left-length 30
set -g status-right-length 60

set -g status-left '#[bold]#{?client_prefix,#[fg=#d6b26a],#[fg=#dfe4ea]} #S #[nobold]#[fg=#333941]│ '
set -g status-right '#[fg=#9db4d0]%H:%M #[fg=#333941]│ #[fg=#8d949e]%d %b #[fg=#333941]│ #[fg=#8d949e]%A '

set -g window-status-format '#[fg=#5a616b] #I:#W#{?window_activity_flag,#[fg=#d6b26a] ●,} '
set -g window-status-current-format '#[fg=#9db4d0,bold] #I:#W#{?window_zoomed_flag,#[fg=#9db4d0] Z,} '

set -g pane-border-style 'fg=#262b32'
set -g pane-active-border-style 'fg=#9db4d0'

set -g message-style 'bg=#9db4d0,fg=#14171b,bold'
set -g message-command-style 'bg=#262b32,fg=#dfe4ea'

set -gw mode-style 'bg=#333941,fg=#dfe4ea'
set -gw copy-mode-match-style 'bg=#3f4b5a,fg=#ffffff'
set -gw copy-mode-current-match-style 'bg=#9db4d0,fg=#14171b,bold'

set -g display-panes-colour '#5a616b'
set -g display-panes-active-colour '#9db4d0'
set -g clock-mode-colour '#9db4d0'
