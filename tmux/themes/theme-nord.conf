# theme: nord

set -g status-style 'bg=#2e3440 fg=#d8dee9'
set -g status-left-length 30
set -g status-right-length 60

set -g status-left '#[fg=#2e3440,bold]#{?client_prefix,#[bg=#ebcb8b],#[bg=#88c0d0]} #S #[fg=#d8dee9,bg=#2e3440,nobold] '
set -g status-right '#[fg=#88c0d0,bold]%H:%M #[fg=#4c566a]· #[fg=#d8dee9]%d %b #[fg=#4c566a]· #[fg=#d8dee9]%A '

set -g window-status-format '#[fg=#616e88] #I #[fg=#d8dee9]#W#{?window_activity_flag,#[fg=#ebcb8b] ●,} '
set -g window-status-current-format '#[fg=#88c0d0,bg=#3b4252,bold] #I #[fg=#eceff4]#W#{?window_zoomed_flag,#[fg=#88c0d0] Z,} '

set -g pane-border-style 'fg=#434c5e'
set -g pane-active-border-style 'fg=#88c0d0'

set -g message-style 'bg=#88c0d0,fg=#2e3440,bold'
set -g message-command-style 'bg=#3b4252,fg=#eceff4'

set -gw mode-style 'bg=#4c6a7d,fg=#eceff4'
set -gw copy-mode-match-style 'bg=#5b7f92,fg=#ffffff'
set -gw copy-mode-current-match-style 'bg=#88c0d0,fg=#2e3440,bold'

set -g display-panes-colour '#616e88'
set -g display-panes-active-colour '#88c0d0'
set -g clock-mode-colour '#88c0d0'
