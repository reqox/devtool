# theme: blue

set -g status-style 'bg=#1b2330 fg=#93a1b5'
set -g status-left-length 30
set -g status-right-length 60

set -g status-left '#[fg=#0b1017,bold]#{?client_prefix,#[bg=#e0af68],#[bg=#61afef]} #S #[fg=#93a1b5,bg=#1b2330,nobold] '
set -g status-right '#[fg=#61afef,bold]%H:%M #[fg=#3b4a5e]· #[fg=#93a1b5]%d %b #[fg=#3b4a5e]· #[fg=#93a1b5]%A '

set -g window-status-format '#[fg=#5d6b80] #I #[fg=#93a1b5]#W#{?window_activity_flag,#[fg=#e0af68] ●,} '
set -g window-status-current-format '#[fg=#61afef,bg=#27313f,bold] #I #[fg=#dbe7f5]#W#{?window_zoomed_flag,#[fg=#61afef] Z,} '

set -g pane-border-style 'fg=#2b3543'
set -g pane-active-border-style 'fg=#61afef'

set -g message-style 'bg=#61afef,fg=#0b1017,bold'
set -g message-command-style 'bg=#27313f,fg=#dbe7f5'

set -gw mode-style 'bg=#2e4f73,fg=#e8f1fb'
set -gw copy-mode-match-style 'bg=#3b5f86,fg=#ffffff'
set -gw copy-mode-current-match-style 'bg=#61afef,fg=#0b1017,bold'

set -g display-panes-colour '#5d6b80'
set -g display-panes-active-colour '#61afef'
set -g clock-mode-colour '#61afef'
