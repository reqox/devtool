# ============================================
# ESSENTIAL SETTINGS
# ============================================

# Fix Vim ESC delay
set -sg escape-time 10

# Increase scrollback buffer
set -g history-limit 50000

# Disable mouse support
set -g mouse off

# Enable focus events for vim autoread
set -g focus-events on

# OSC 52: приложения (nvim в контейнере или по ssh) могут писать в буфер
# обмена. Только запись: на запрос чтения tmux не отвечает, а Alacritty
# такие запросы блокирует. При вложенном tmux строка нужна на каждом уровне.
set -g set-clipboard on

# Set terminal with proper colors
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Aggressive resize for multi-client
setw -g aggressive-resize on

# ============================================
# KEY BINDINGS
# ============================================

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Vim-style pane navigation
bind j select-pane -D
bind k select-pane -U
bind h select-pane -L
bind l select-pane -R

# Vim-style pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ============================================
# APPEARANCE
# ============================================

unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Status bar position
set -g status-position top

# Status bar colors
set -g status-style 'bg=#1e222a fg=#a0a8b7'
set -g status-left-length 30
set -g status-right-length 60

# Status bar content
set -g status-left '#[fg=#1e222a,bg=#61afef,bold] #S #[fg=#61afef,bg=#1e222a] #[fg=#abb2bf] '
set -g status-right '#[fg=#3e4451] #[fg=#61afef]%H:%M #[fg=#3e4451]• #[fg=#a0a8b7]%d %b #[fg=#3e4451]• #[fg=#a0a8b7]%A '

# Window status
setw -g window-status-format ' #I:#W '
setw -g window-status-current-format '#[fg=#61afef,bg=#282c34,bold] #I:#W#F '

# Pane border colors
set -g pane-border-style 'fg=#2c313a'
set -g pane-active-border-style 'fg=#61afef'

# Message styling
set -g message-style 'bg=#61afef fg=#1e222a bold'

