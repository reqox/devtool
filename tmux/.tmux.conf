# ── core ──────────────────────────────────────────────

set -sg escape-time 10
set -g history-limit 50000
set -g mouse off
set -g focus-events on
set -g extended-keys on
set -g set-clipboard on

set -g default-terminal "tmux-256color"
set -gu terminal-features
set -as terminal-features "xterm-256color:RGB"

set -g set-titles on
set -g set-titles-string "#S:#I:#W"

set -gw aggressive-resize on
set -gw monitor-activity on
set -g visual-activity off
set -g detach-on-destroy off

# ── keys ──────────────────────────────────────────────

set -g prefix C-a
unbind C-b
bind C-a send-prefix

bind r source-file ~/.tmux.conf \; display -d 500 "Config reloaded!"

bind T display-menu -T "Theme#{?#{@theme}, — #{@theme},}" \
    "alert"            a { run-shell '~/.tmux/themes/select-theme alert' } \
    "blue"             b { run-shell '~/.tmux/themes/select-theme blue' } \
    "mono"             m { run-shell '~/.tmux/themes/select-theme mono' } \
    "nord"             n { run-shell '~/.tmux/themes/select-theme nord' } \
    "purple"           p { run-shell '~/.tmux/themes/select-theme purple' } \
    "simple"           s { run-shell '~/.tmux/themes/select-theme simple' } \
    "warm"             w { run-shell '~/.tmux/themes/select-theme warm' } \
    '' \
    "blue powerline"   B { run-shell '~/.tmux/themes/select-theme blue-powerline' } \
    "nord powerline"   N { run-shell '~/.tmux/themes/select-theme nord-powerline' } \
    "purple powerline" P { run-shell '~/.tmux/themes/select-theme purple-powerline' } \
    "warm powerline"   W { run-shell '~/.tmux/themes/select-theme warm-powerline' }

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── copy mode ─────────────────────────────────────────

set -gw mode-keys vi

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel \
    "wl-copy 2>/dev/null || xclip -selection clipboard -i 2>/dev/null"

# ── appearance ────────────────────────────────────────

set -g status-position top
source-file ~/.tmux/themes/theme.conf
